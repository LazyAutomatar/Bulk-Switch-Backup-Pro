name: Release Pipeline

# Builds from this PRIVATE repo and publishes the release assets to the PUBLIC
# releases repo (RELEASES_REPO). Needs the RELEASES_PAT secret: a fine-grained
# token with "Contents: Read and write" on RELEASES_REPO only.
#
# Release:  git tag v2.5.0 && git push origin v2.5.0
# Beta:     git tag v2.5.0-beta.1 && git push origin v2.5.0-beta.1  (published as pre-release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.5.0)'
        required: true

permissions:
  contents: read

env:
  RELEASES_REPO: LazyAutomatar/Bulk-Switch-Backup-Pro

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Load and validate public code-signing identity
        if: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) {
            throw 'Configure WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD with a publicly trusted code-signing certificate before publishing.'
          }
          $env:CERT_PATH = Join-Path $env:RUNNER_TEMP 'bulk-backup-signing.pfx'
          [IO.File]::WriteAllBytes($env:CERT_PATH, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "CERT_PATH=$env:CERT_PATH" >> $env:GITHUB_ENV
          ./scripts/sign-windows-artifact.ps1 -CheckCertificateOnly

      - name: Validate core and desktop before packaging
        shell: pwsh
        run: ./scripts/test-all.ps1

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Bad tag '$($env:TAG_NAME)'. Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.1"
          }
          $version = $env:TAG_NAME.TrimStart('v')
          "tag=$($env:TAG_NAME)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Run Cross-Compiler Pipeline
        if: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CERT_PASS: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./publish-all.ps1 -Configuration Release -Version "${{ steps.ver.outputs.version }}" -Repo "$env:RELEASES_REPO"

      - name: Retrieve locally signed Windows packages for owner-authorized release
        if: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          gh release download "${{ steps.ver.outputs.tag }}" --repo "$env:RELEASES_REPO" --dir dist --clobber --pattern '*.exe' --pattern '*win-x64.zip' --pattern 'update_manifest.json' --pattern '*.cer'
          if ($LASTEXITCODE -ne 0) { throw 'Locally signed draft artifacts are required.' }
          foreach ($file in @('BulkSwitchBackupPro.exe', 'BulkSwitchBackupPro_Setup.exe', "BulkSwitchBackupPro_Setup_$($steps.ver.outputs.tag).exe")) {
            $path = Join-Path dist $file
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.SignerCertificate.Thumbprint -ne '6C7AA04A7196660417CCE9B5C5BD42ED84408366' -or $null -eq $signature.TimeStamperCertificate -or $signature.Status -notin @('Valid', 'NotTrusted', 'UnknownError')) {
              throw "Unexpected signature on $file"
            }
            if ((Get-Item -LiteralPath $path).VersionInfo.CompanyName.Trim() -ne 'Yash Nalawde') { throw "Incorrect author on $file" }
          }
          $manifest = Get-Content dist/update_manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne "${{ steps.ver.outputs.version }}" -or $manifest.sha256 -ne (Get-FileHash dist/BulkSwitchBackupPro_Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() -or $manifest.fileSizeBytes -ne (Get-Item dist/BulkSwitchBackupPro_Setup.exe).Length) { throw 'Installer manifest mismatch.' }
          Write-Warning 'Owner-authorized self-signed release: Windows trust warnings remain expected. Private signing key stays on the owner laptop.'
          ./publish-all.ps1 -Target mac -Configuration Release -Version "${{ steps.ver.outputs.version }}" -Repo "$env:RELEASES_REPO"
          ./publish-all.ps1 -Target linux -Configuration Release -Version "${{ steps.ver.outputs.version }}" -Repo "$env:RELEASES_REPO"

      - name: Extract version-specific release notes
        shell: pwsh
        run: |
          ./scripts/release-notes.ps1 -Version "${{ steps.ver.outputs.version }}" -OutputPath artifacts/release-notes.md
          Copy-Item scripts/BulkSwitchBackupPro_Install_Silent.cmd dist/BulkSwitchBackupPro_Install_Silent.cmd

      - name: Verify artifacts
        shell: pwsh
        run: |
          foreach ($f in "dist/update_manifest.json", "dist/BulkSwitchBackupPro_Setup.exe", "dist/BulkSwitchBackupPro-win-x64.zip") {
            if (-not (Test-Path $f)) {
              throw "Missing release artifact $f"
            }
          }
          if (Test-Path "dist/update_manifest.json") {
            $m = Get-Content dist/update_manifest.json -Raw | ConvertFrom-Json
            Write-Host "Manifest version: $($m.version)"
          }

      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_PAT }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Bulk Switch Backup Pro ${{ steps.ver.outputs.tag }}"
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          body_path: artifacts/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/update_manifest.json
            dist/BulkSwitchBackupPro*.exe
            dist/BulkSwitchBackupPro*.zip
            dist/BulkSwitchBackupPro*.tar.gz
            dist/BulkSwitchBackupPro*.cer
            dist/BulkSwitchBackupPro*.cmd

      - name: Sync documentation, EULA, and assets to public repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          REPO: ${{ env.RELEASES_REPO }}
        run: |
          Write-Host "Syncing documentation and EULA to $env:REPO..."
          $tmpDir = Join-Path $env:RUNNER_TEMP "public-repo-sync"
          if (Test-Path $tmpDir) { Remove-Item -Recurse -Force $tmpDir }
          git clone "https://x-access-token:${env:GH_TOKEN}@github.com/$env:REPO.git" $tmpDir

          if (Test-Path "README.md") { Copy-Item "README.md" "$tmpDir\README.md" -Force }
          if (Test-Path "EULA.txt") { Copy-Item "EULA.txt" "$tmpDir\EULA.txt" -Force }
          if (Test-Path "LICENSE.md") { Copy-Item "LICENSE.md" "$tmpDir\LICENSE.md" -Force }
          if (Test-Path "CHANGELOG.md") { Copy-Item "CHANGELOG.md" "$tmpDir\CHANGELOG.md" -Force }
          if (Test-Path "PLATFORM_SUPPORT.md") { Copy-Item "PLATFORM_SUPPORT.md" "$tmpDir\PLATFORM_SUPPORT.md" -Force }
          New-Item -ItemType Directory -Path "$tmpDir\dist" -Force | Out-Null
          Copy-Item "dist/update_manifest.json" "$tmpDir\dist\update_manifest.json" -Force
          if (Test-Path "Logo.png") { Copy-Item "Logo.png" "$tmpDir\Logo.png" -Force }
          if (Test-Path "Assets") {
            if (-not (Test-Path "$tmpDir\Assets")) { New-Item -ItemType Directory -Path "$tmpDir\Assets" -Force }
            Copy-Item "Assets\*" "$tmpDir\Assets" -Recurse -Force
          }

          Push-Location $tmpDir
          git config user.name "Yash Nalawde"
          git config user.email "146139825+Majordean0303@users.noreply.github.com"
          git add -A
          $hasChanges = (git status --porcelain).Length -gt 0
          if ($hasChanges) {
            git commit -m "docs: sync README, EULA, and release assets for ${{ steps.ver.outputs.tag }}"
            git push origin main
            Write-Host "Successfully synced README, EULA, and assets to $env:REPO" -ForegroundColor Green
          } else {
            Write-Host "Public repository docs are already up to date." -ForegroundColor Cyan
          }
          Pop-Location

      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $signingPath = Join-Path $env:RUNNER_TEMP 'bulk-backup-signing.pfx'
          if (Test-Path -LiteralPath $signingPath) { Remove-Item -LiteralPath $signingPath -Force }
